name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Write Apple API Key
        if: matrix.os == 'macos-latest'
        run: echo "$APPLE_API_KEY_CONTENT" > /tmp/apple_api_key.p8
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}

      - name: Check Apple API Key format
        if: matrix.os == 'macos-latest'
        run: |
          echo "Key file first 30 chars:"
          head -c 30 /tmp/apple_api_key.p8
          echo ""
          echo "KEY_ID length: ${#APPLE_API_KEY_ID}"
          echo "ISSUER length: ${#APPLE_API_ISSUER}"
          echo "notarytool version:"
          xcrun notarytool --version
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Test notarytool credentials
        if: matrix.os == 'macos-latest'
        run: |
          xcrun notarytool history \
            --key /tmp/apple_api_key.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" 2>&1 &
          NOTARY_PID=$!
          sleep 30
          if kill -0 $NOTARY_PID 2>/dev/null; then
            echo "notarytool timed out after 30s - likely a network issue"
            kill $NOTARY_PID
          else
            wait $NOTARY_PID || true
          fi
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build and Package
        timeout-minutes: 15
        run: npx electron-vite build && npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: /tmp/apple_api_key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DEBUG: "electron-builder,@electron/notarize*"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
          generate_release_notes: true
